services:
    app:
        build: .
        container_name: app
        ports:
            - 8000:8000
        volumes:
            - .:/app
        env_file: .env.dev
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        networks:
            - bitwarden

    db:
        image: postgres:17-alpine
        container_name: db
        expose:
            - 5432
        volumes:
            - db-data:/var/lib/postgresql/data
        env_file: .env.dev
        healthcheck:
            test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
            interval: 5s
            timeout: 10s
            retries: 5
        networks:
            - bitwarden
    
    pgadmin:
        image: dpage/pgadmin4
        container_name: pgadmin
        ports:
            - 5050:80
        env_file: .env.dev
        depends_on:
            db:
                condition: service_healthy
        networks:
            - bitwarden

volumes:
    db-data:

networks:
    bitwarden:
